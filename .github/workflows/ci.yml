name: Aegis Enterprise AI CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/aegis-enterprise-ai

jobs:
  lint-and-test:
    name: Code Quality, Unit Tests & Regression Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: aegis_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Code Quality Checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run Phase 2 (RAG & Model Serving) Tests
        run: pytest tests/test_phase2.py -v

      - name: Run Phase 3 (Multi-Agent & Security) Tests
        run: pytest tests/test_phase3.py -v

      - name: Run Phase 4 (Kafka, Spark, dbt, Airflow) Tests
        run: pytest tests/test_phase4.py -v

      - name: Run Phase 5 (AIOps, RCA & Prometheus) Tests
        run: pytest tests/test_phase5.py -v

      - name: Run Phase 7 (RAGAS & Agent Regression Gates) Tests
        run: pytest eval/test_eval_gates.py -v

      - name: Run 20-Fault Chaos Engineering Evaluation
        run: python eval/run_aiops_eval.py

  build-and-push-image:
    name: Build, Scan & Push Container Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aegis-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Test Container
        run: |
          docker run -d --name aegis --read-only --tmpfs /tmp \
            --tmpfs /app/data:uid=10001,gid=10001 -p 8000:8000 aegis-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs aegis
          exit 1

      - name: Scan Image for Vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aegis-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & Push Image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${IMAGE_NAME,,}"
          docker tag aegis-api:ci "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag aegis-api:ci "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
