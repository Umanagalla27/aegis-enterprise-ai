name: Aegis Enterprise AI CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]          # trigger on version tags like v1.0.0
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # umanagalla27/aegis-enterprise-ai

jobs:
  # ── Job 1: Lint, test, quality gates ──────────────────────────────────
  lint-and-test:
    name: Code Quality, Unit Tests & Regression Gates
    runs-on: ubuntu-latest
    env:
      AEGIS_DATABASE_URL: postgresql://postgres:password@localhost:5432/aegis_db

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: aegis_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Code Quality Checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run Phase 2 (RAG & Model Serving) Tests
        run: pytest tests/test_phase2.py -v

      - name: Run Phase 3 (Multi-Agent & Security) Tests
        run: pytest tests/test_phase3.py -v

      - name: Run Postgres Checkpointer Concurrency Tests (2 Workers, 20 Cycles)
        run: pytest tests/test_postgres_checkpointer.py -v -s

      - name: Run Phase 4 (Kafka, Spark, dbt, Airflow) Tests
        run: pytest tests/test_phase4.py -v

      - name: Run Phase 5 (AIOps, RCA & Prometheus) Tests
        run: pytest tests/test_phase5.py -v

      - name: Run Bug-Fix Regression Tests
        run: pytest tests/test_regressions.py -v

      - name: Run Phase 7 (RAGAS & Agent Regression Gates) Tests
        run: pytest eval/test_eval_gates.py -v

      - name: Run 20-Fault Chaos Engineering Evaluation
        run: python eval/run_aiops_eval.py

  # ── Job 2: Build & push Docker image ──────────────────────────────────
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'   # only on main push or tags, not PRs
    permissions:
      contents: read
      packages: write

    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      image_tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata & tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          TAGS="${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}"
          TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:latest"

          # If this is a version tag (e.g. v1.0.0), also push :1.0.0
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "### 🐳 Image Tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${TAGS}" | tr ',' '\n' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Auto-update values.yaml with the new SHA tag ───────────────
  update-helm-tag:
    name: Update Helm Image Tag
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update values.yaml with new SHA tag
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.short_sha }}
        run: |
          echo "Updating image tag to: ${NEW_TAG}"
          # Replace the tag line in values.yaml (matches '  tag: "..."')
          sed -i "s|^  tag: \".*\"|  tag: \"${NEW_TAG}\"|" \
            k8s/helm/aegis-platform/values.yaml
          echo "### ✅ Helm tag updated" >> "$GITHUB_STEP_SUMMARY"
          echo "New tag: \`${NEW_TAG}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push tag update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/helm/aegis-platform/values.yaml
          # Only commit if there are actual changes
          git diff --cached --quiet && echo "No tag change" && exit 0
          git commit -m "ci: update image tag to ${{ needs.build-and-push.outputs.short_sha }} [skip ci]"
          git push
