# Single-VM production stack:
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env up -d
# Only Caddy (80/443) is published; the API, Postgres, Redis, Prometheus and Grafana
# stay on the private compose network.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ghcr.io/umanagalla27/aegis-enterprise-ai:${IMAGE_TAG:?set IMAGE_TAG in .env}
    restart: unless-stopped
    # tini as PID 1 reaps stray processes (e.g. HEALTHCHECK probes that outlive their
    # parent). Without it gunicorn is PID 1, reaps them itself and logs a misleading
    # "Worker (pid:N) exited with code 1" for probes that ran before startup finished.
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/data:uid=10001,gid=10001
    environment:
      AEGIS_API_KEY: ${AEGIS_API_KEY:?set AEGIS_API_KEY in .env}
      AEGIS_CORS_ORIGINS: ${AEGIS_CORS_ORIGINS:?set AEGIS_CORS_ORIGINS in .env}
      # Shared state: lets several workers serve HITL approvals and share baselines.
      AEGIS_DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/aegis
      AEGIS_REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: "2"
      # Only Caddy can reach the API, so trust its X-Forwarded-For for client IPs
      # (rate limits are per client, not per proxy).
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging: *default-logging

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aegis
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    # Reach it through an SSH tunnel: ssh -L 3001:localhost:3001 user@vm
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    logging: *default-logging

volumes:
  caddy_data:
  pg_data:
  redis_data:
  prom_data:
  grafana_data:
