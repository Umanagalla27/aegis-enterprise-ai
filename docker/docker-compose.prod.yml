# Single-VM production stack: docker compose -f docker/docker-compose.prod.yml --env-file docker/.env up -d
# Only Caddy (80/443) is published; the API, Prometheus and Grafana stay on the private network.
services:
  api:
    image: ghcr.io/umanagalla27/aegis-enterprise-ai:${IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/data:uid=10001,gid=10001
    environment:
      AEGIS_CORS_ORIGINS: ${AEGIS_CORS_ORIGINS}
      WEB_CONCURRENCY: "2"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    # Reach it through an SSH tunnel: ssh -L 3001:localhost:3001 user@vm
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  caddy_data:
  prom_data:
  grafana_data:
