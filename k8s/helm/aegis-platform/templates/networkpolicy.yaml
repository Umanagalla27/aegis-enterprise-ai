{{- if .Values.networkPolicy.enabled }}
# Default-deny inbound for the API pods: only the ingress controller (user traffic)
# and Prometheus (scrapes) can connect. Outbound is left open for Postgres/Redis,
# which may be managed services outside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis-platform.fullname" . }}
  labels:
    {{- include "aegis-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegis-platform.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort | default 8000 }}
{{- end }}
