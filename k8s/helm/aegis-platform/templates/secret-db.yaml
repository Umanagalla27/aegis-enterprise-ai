apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis-platform.fullname" . }}-db
  labels:
    {{- include "aegis-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Override via `--set db.url=...` or a sealed-secret controller in prod
  AEGIS_DATABASE_URL: {{ .Values.db.url | quote }}
