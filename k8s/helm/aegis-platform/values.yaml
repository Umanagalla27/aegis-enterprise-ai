replicaCount: 3

image:
  # Pushed by .github/workflows/ci.yml; CI pins the tag to the commit SHA
  repository: ghcr.io/umanagalla27/aegis-enterprise-ai
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []

env:
  CORS_ORIGINS: "https://api.aegis.enterprise.ai"
  WEB_CONCURRENCY: "2"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.aegis.enterprise.ai
      paths:
        - path: /
          pathType: Prefix
  # cert-manager only issues a certificate when the Ingress has a tls block
  tls:
    - secretName: aegis-api-tls
      hosts:
        - api.aegis.enterprise.ai

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80
