replicaCount: 3

image:
  # Pushed by .github/workflows/ci.yml. A release tag (git tag v1.0.0) publishes :1.0.0;
  # every commit on main also publishes :<short-sha>. Deploy = change this tag in Git.
  repository: ghcr.io/umanagalla27/aegis-enterprise-ai
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []

env:
  AEGIS_CORS_ORIGINS: "https://api.aegis.enterprise.ai"
  WEB_CONCURRENCY: "2"
  # Pods are reachable only through the ingress controller (see networkPolicy), so its
  # X-Forwarded-For is trusted for client IPs (per-client rate limits).
  FORWARDED_ALLOW_IPS: "*"

# Secret with the keys below, created outside Git (kubectl, External Secrets, Vault):
#   kubectl -n aegis-production create secret generic aegis-secrets \
#     --from-literal=api-key="$(openssl rand -hex 32)" \
#     --from-literal=database-url="$AEGIS_DATABASE_URL" \
#     --from-literal=redis-url='redis://HOST:6379/0'
# Several replicas or workers need it: HITL approvals, anomaly baselines and rate-limit
# counters live in Postgres/Redis. Leave it empty only for a single replica (dev / kind).
secrets:
  existingSecret: "aegis-secrets"
  apiKeyKey: api-key
  databaseUrlKey: database-url
  redisUrlKey: redis-url

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.aegis.enterprise.ai
      paths:
        - path: /
          pathType: Prefix
  # cert-manager only issues a certificate when the Ingress has a tls block
  tls:
    - secretName: aegis-api-tls
      hosts:
        - api.aegis.enterprise.ai

# Measured with 2 workers: ~400 MiB idle, ~475 MiB under concurrent eval/ETL load.
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
    # Local disk (logs, /tmp, /app/data); exceeding it evicts this pod, not the whole node
    ephemeral-storage: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi
    ephemeral-storage: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

# Keeps at least this many pods up during node drains and cluster upgrades.
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Only the ingress controller and Prometheus may open connections to the pods.
networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
