replicaCount: 3

image:
  repository: ghcr.io/umanagalla27/aegis-enterprise-ai
  pullPolicy: Always
  # CI auto-updates this to the commit SHA after each successful build.
  # Fallback "latest" ensures first deploy works; production should pin to SHA.
  tag: "latest"

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.aegis.enterprise.ai
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

db:
  # Connection string for LangGraph PostgresSaver checkpointer.
  # Override per-environment with --set db.url=...
  url: "postgresql://uma:password@aegis-postgres:5432/aegis_db"
