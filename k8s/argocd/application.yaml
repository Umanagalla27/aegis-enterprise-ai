apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/UmaNagallaa/aegis-enterprise-ai.git'
    targetRevision: HEAD
    path: k8s/helm/aegis-platform
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: aegis-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
